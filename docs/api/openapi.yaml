openapi: 3.1.0
info:
  title: Snacklist API
  version: 1.3.0
  summary: One household's Snacklist shopping list over HTTP.
  description: >-
    The guide is docs/API.md in the family-groceries repository: authentication with API keys,
    scopes, idempotency, errors, rate limits and versioning. Every response carries
    X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset and X-Request-Id.
  contact:
    url: https://github.com/trost-systems/snacklist/blob/main/docs/API.md
servers:
  - url: https://jdwqrallbpdbshrdhenk.supabase.co/functions/v1/api
    description: Production
  - url: http://127.0.0.1:54321/functions/v1/api
    description: Local stack (scripts/dev.sh)
security:
  - apiKey: []
# The headers of every successful response, written once (a YAML anchor).
x-ok-headers: &ok
  X-RateLimit-Limit: { $ref: '#/components/headers/Limit' }
  X-RateLimit-Remaining: { $ref: '#/components/headers/Remaining' }
  X-RateLimit-Reset: { $ref: '#/components/headers/Reset' }
  X-Request-Id: { $ref: '#/components/headers/RequestId' }
  Idempotent-Replayed: { $ref: '#/components/headers/Replayed' }
tags:
  - name: items
  - name: catalog
  - name: household
paths:
  /v1/items:
    get:
      operationId: listItems
      tags: [items]
      summary: Open items in aisle order, or store by store in walk order
      description: >-
        With store, that store's items plus the ones without a store. order=aisle (the default):
        categories in aisle order (with store, that store's), inside a category the household's
        walk order. order=walk: store by store in the stores' order, then the items without a
        store, each by position. Without list, the items of every list of the household. counts is
        always the whole list's (with list, that list's). Requires the read scope.
      parameters:
        - name: store
          in: query
          description: A store id or name (any case, umlauts optional, a unique part is enough).
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: category
          in: query
          description: A category id or name, matched like store.
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: list
          in: query
          description: A list id or exact name (any case); see GET /v1/lists.
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: >-
            nextCursor of the previous page, with the same store, category, list and order. A
            walk cursor is refused (invalid_cursor) once the household changed its order mode.
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [aisle, walk], default: aisle }
      responses:
        '200':
          description: One page of open items.
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, counts, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  counts: { $ref: '#/components/schemas/Counts' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addItems
      tags: [items]
      summary: Add 1 to 50 items
      description: >-
        Names are split like everywhere in Snacklist ("2 Gurken" is Gurken, quantity 2). An item
        already on the list is not added again (alreadyOnList); a spelling variant or synonym of
        an open item is added and reported (similarOnList, at most three open items per added
        item). The items go to the list given by
        list, else to the key owner's default list (chosen in the app, else the household's first
        list; where Siri and Alexa add too); "already on the list" means on that list. One
        transaction: an unknown store, category or list fails the whole batch, and so does a batch
        whose adds take longer than 5 seconds together (503 timeout). Requires the write scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/NewItem' }
                list:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: A list id or exact name (any case); see GET /v1/lists.
      responses:
        '200':
          description: Nothing new; every item was already on the list.
          headers: *ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddResult' }
        '201':
          description: At least one item was added.
          headers: *ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/items/recent:
    get:
      operationId: recentItems
      tags: [items]
      summary: Recently ticked items, the app's "Zuletzt verwendet"
      description: >-
        Ticked items, newest first, one per thing (its newest purchase; spelling variants of one
        thing count as one), none for a thing that is open on the list again. Like the app's
        "Zuletzt verwendet". With list, that list's; without, every list's at once. An item's id
        works with POST /v1/items/{id}/untick. Requires the read scope.
      parameters:
        - name: list
          in: query
          description: A list's id or exact name (any case). Without it, every list.
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: limit
          in: query
          description: How many at most, 1 to 50; default 20, what the app shows.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: The recently ticked items (one answer; nextCursor is always null).
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RecentItem' } }
                  nextCursor: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: getItem
      tags: [items]
      summary: One item, open or ticked
      description: Requires the read scope.
      responses:
        '200': { $ref: '#/components/responses/OneItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateItem
      tags: [items]
      summary: Edit an open item
      description: >-
        Changes any of the item's name, quantity, brand, properties, list, category and store, like
        the app's edit sheet; at least one field. null or a blank text clears quantity, brand or
        properties. A new list keeps the item's category and store. A new category or store puts
        the item at the end of its new group, and the household remembers both for the next time
        the item is added. With the learned order, a new store gives the item its place in that
        store's order instead (a new category alone keeps its place). Only open items: a ticked
        one is item_not_found. A rename that would make the item the twin of another open item on
        its list (same name, brand and properties) is a 409 conflict and changes nothing. Requires
        the write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemEdit' }
      responses:
        '200': { $ref: '#/components/responses/OneItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EditConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Remove an item, open or ticked
      description: >-
        Removes the item like a delete in the app and answers with the item as it was. What the
        household taught Snacklist about it (category, store) stays for the next add. With an
        Idempotency-Key a retry gets the same answer instead of item_not_found. Requires the write
        scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The item as it was before it was removed.
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/items/{id}/tick:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: tickItem
      tags: [items]
      summary: Tick an item (bought)
      description: A ticked item stays ticked; safe to repeat. Requires the write scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OneItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/items/{id}/untick:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: untickItem
      tags: [items]
      summary: Put a ticked item back on the list
      description: An open item stays open; safe to repeat. Requires the write scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OneItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/items/{id}/place:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: placeItem
      tags: [items]
      summary: Put an open item right before or after another
      description: >-
        Exactly one of before and after, another open item of the household. With the learned
        order the place in the store is set by hand and the anchor must be in the same store
        (anchor_in_other_store); with the categories order the item takes the anchor's store and
        category. Placing next to the same anchor again changes nothing. Requires the write scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                before: { type: string, format: uuid, description: The item to stand before. }
                after: { type: string, format: uuid, description: The item to stand after. }
      responses:
        '200': { $ref: '#/components/responses/OneItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: The household's categories in aisle order
      description: Requires the read scope.
      responses:
        '200': { $ref: '#/components/responses/Catalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/lists:
    get:
      operationId: listLists
      tags: [catalog]
      summary: The household's lists in their order
      description: >-
        A household has one or more lists (for example "Wocheneinkauf" and "Baumarkt"). An add
        without list goes to the key owner's default list (chosen in the app, else the first, the
        lowest sortOrder), the one marked default. Requires the read scope.
      responses:
        '200':
          description: The whole list (short; nextCursor is always null).
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/List' } }
                  nextCursor: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createList
      tags: [catalog]
      summary: Make a list
      description: >-
        A new list after the others, like in the app (public.create_list). Names need not be
        unique. A household has at most 50 lists (409 too_many_lists). Send an Idempotency-Key to
        retry without making a second list. Requires the write scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewList' }
      responses:
        '201': { $ref: '#/components/responses/OneList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/LimitReached' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    patch:
      operationId: updateList
      tags: [catalog]
      summary: Rename or move a list
      description: >-
        Renames the list and/or puts it at position (0 is first, past the end is last; the
        household's lists are numbered 0, 1, 2... again), like in the app. A member who never
        picked a default list in the app has the first one as default, so moving another list
        first changes where their adds without list go. Another household's list, or none, is
        404 list_not_found. Requires the write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListEdit' }
      responses:
        '200': { $ref: '#/components/responses/OneList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/household:
    get:
      operationId: getHousehold
      tags: [household]
      summary: The key's household
      description: >-
        The household the key works in: its name, the currency the app shows prices in and how
        many members it has. Never a member's name, email address or user id. Requires the read
        scope.
      responses:
        '200':
          description: The household.
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Household' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/stores:
    get:
      operationId: listStores
      tags: [catalog]
      summary: The household's stores
      description: Requires the read scope.
      responses:
        '200': { $ref: '#/components/responses/Catalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addStore
      tags: [catalog]
      summary: Add a store
      description: >-
        A store by its plain name, like in the app (public.add_store); no chain or other retailer
        field. dm, Lidl, Edeka and a Baumarkt get their aisle layout. A name the household has
        already (any case, umlauts folded) answers that store with 200 instead of 201. A household
        has at most 50 stores this way (409 too_many_stores). Requires the write scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreName' }
      responses:
        '200': { $ref: '#/components/responses/OneStore' }
        '201': { $ref: '#/components/responses/OneStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/LimitReached' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/stores/{id}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    patch:
      operationId: updateStore
      tags: [catalog]
      summary: Rename a store
      description: >-
        Renames the store, like in the app (public.rename_store). A name another store of the
        household has is a 409 conflict and changes nothing. Another household's store, or none,
        is 404 store_not_found. Requires the write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreName' }
      responses:
        '200': { $ref: '#/components/responses/OneStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/stores/{id}/layout:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      operationId: getStoreLayout
      tags: [catalog]
      summary: A store's walk order
      description: >-
        Every category of the household in the store's walk order, the order GET /v1/items?store=
        shows. hidden marks the categories the store does not carry. Requires the read scope.
      responses:
        '200': { $ref: '#/components/responses/Layout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: setStoreLayout
      tags: [catalog]
      summary: Set a store's walk order
      description: >-
        Like the store screen in the app (public.set_store_layout). categories (ids or names) come
        first, in that order; the others follow in their current order. hidden, when given, is
        every category the store does not carry; without it they stay. A category named twice is
        400 validation_failed. Answers the whole new order. With the learned order the walk order
        is only the default order for new items; the open items' order in the store is what the
        household learned and what place and setStoreOrder set. Requires the write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutEdit' }
      responses:
        '200': { $ref: '#/components/responses/Layout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/stores/{id}/order:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    put:
      operationId: setStoreOrder
      tags: [catalog]
      summary: Set the order of a store's open items (learned order only)
      description: >-
        The listed items, open items of that store, come first in this order as places set by
        hand; the store's other open items keep their order after them. Returns the store's open
        items in their new order. A household with the categories order gets 409 order_mode.
        Sending the same order again changes nothing. Requires the write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The store's open items in their new order.
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /v1/suggestions:
    get:
      operationId: suggestItems
      tags: [items]
      summary: What the household usually buys
      description: >-
        The household's usuals, ranked like the app's suggestions (public.suggest_items): bought
        often and lately first; things open on a list are left out. With prefix, names starting
        with it, then names with a word starting with it. uses counts the days with a use in the
        last year; due is true when its usual interval since the last purchase is up. Requires the
        read scope.
      parameters:
        - name: prefix
          in: query
          description: The start of a name, e.g. Mil. Without it, all usuals.
          schema: { type: string, maxLength: 60 }
        - name: limit
          in: query
          description: How many at most, 1 to 50; default 10.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: due
          in: query
          description: >-
            With true, only the usuals that are due, picked from all of them, not from the
            first limit by rank (the app's "due again" rows).
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: The usuals in their rank (one answer; nextCursor is always null).
          headers: *ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Usual' } }
                  nextCursor: { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: fgp_ followed by 43 base64url characters
      description: >-
        An API key from the Snacklist app (More, Zugänge, API) with the scope read, or read and
        write. MCP tokens, Siri credentials and OAuth tokens are not accepted.
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StoreId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        The first successful response for this key is replayed for 24 hours (per API key) with
        Idempotent-Replayed true. The same key with another request is a 422
        idempotency_key_reused.
      schema: { type: string, pattern: '^[\x21-\x7e]{1,255}$' }
  headers:
    Limit:
      description: Size of the limit closest to running out (20 per key, 1000 per household and day; 20 unknown keys per address when unauthenticated).
      schema: { type: integer }
    Remaining:
      description: Requests left in that limit after this one.
      schema: { type: integer }
    Reset:
      description: Seconds until that limit is full again.
      schema: { type: integer }
    RetryAfter:
      description: Seconds until the next request can succeed.
      schema: { type: integer }
    RequestId:
      description: Identifies this request in our logs.
      schema: { type: string, format: uuid }
    Replayed:
      description: true when the response is a stored one for the Idempotency-Key.
      schema: { type: string, enum: ['true'] }
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [id, name, brand, properties, quantity, category, categoryId, store, storeId, position, status, addedAt, listId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Windeln] }
        brand: { type: [string, 'null'], examples: [Pampers] }
        properties: { type: [string, 'null'], examples: ['Größe 3, Big Pack'] }
        quantity: { type: [string, 'null'], examples: ['2', '500 g'] }
        category: { type: string, examples: [Drogerie] }
        categoryId: { type: string, format: uuid }
        store: { type: [string, 'null'], examples: [dm] }
        storeId: { type: [string, 'null'], format: uuid }
        position:
          type: [integer, 'null']
          minimum: 1
          description: >-
            1-based place among the open items of its list in its store (or among those without a
            store), in the household's order; null for a ticked item.
        status: { type: string, enum: [open, ticked] }
        addedAt: { type: string, format: date-time, examples: ['2026-11-02T08:00:00.123456+00:00'] }
        listId: { type: string, format: uuid, description: The list the item is on (GET /v1/lists). }
    NewItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, examples: ['Windeln Pampers Größe 3'] }
        quantity: { type: string, minLength: 1, maxLength: 40 }
        brand: { type: string, maxLength: 60 }
        properties: { type: string, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60, description: 'A category id or name; learned like a correction in the app.' }
        store: { type: string, minLength: 1, maxLength: 60, description: A store id or name. }
    AddResult:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [added, alreadyOnList, similarOnList]
          properties:
            added: { type: array, items: { $ref: '#/components/schemas/Item' } }
            alreadyOnList: { type: array, items: { $ref: '#/components/schemas/Item' } }
            similarOnList:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [itemId, onList, total]
                properties:
                  itemId: { type: string, format: uuid, description: The item just added. }
                  onList:
                    type: array
                    maxItems: 3
                    description: The similar open items, the oldest first.
                    items: { $ref: '#/components/schemas/Item' }
                  total: { type: integer, minimum: 1, description: How many similar open items there are. }
    ItemEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field. Fields left out stay as they are.
      properties:
        name:
          description: The new name, taken as it is (not split like an add).
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          description: Menge; null or a blank text clears it.
          type: [string, 'null']
          maxLength: 40
        brand:
          description: Marke; null or a blank text clears it.
          type: [string, 'null']
          maxLength: 60
        properties:
          description: Eigenschaften, comma-separated; null or a blank text clears them.
          type: [string, 'null']
          maxLength: 120
        list:
          description: A list id or exact name (any case); moves the item to that list.
          type: string
          minLength: 1
          maxLength: 60
        category:
          description: A category id or name.
          type: string
          minLength: 1
          maxLength: 60
        store:
          description: A store id or name; null removes the store.
          type: [string, 'null']
          minLength: 1
          maxLength: 60
    Household:
      type: object
      additionalProperties: false
      required: [id, name, currency, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Familie Brandt] }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code., examples: [EUR] }
        memberCount: { type: integer, minimum: 1 }
    List:
      type: object
      additionalProperties: false
      required: [id, name, sortOrder, default]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Wocheneinkauf] }
        sortOrder: { type: integer }
        default:
          type: boolean
          description: true for the key owner's default list, where adds without list go.
    NewList:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, examples: [Baumarkt] }
    ListEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        position: { type: integer, minimum: 0, maximum: 1000, description: 0 is first. }
    StoreName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: The store's plain name; no chain or retailer field.
          examples: [Rewe]
    LayoutCategory:
      type: object
      additionalProperties: false
      required: [id, name, sortOrder, hidden]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer }
        hidden: { type: boolean, description: The store does not carry it. }
    LayoutEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categories:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 60 }
          description: Category ids or names, first in this order.
        hidden:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 60 }
          description: Every category the store does not carry.
    RecentItem:
      type: object
      additionalProperties: false
      required: [id, name, brand, properties, quantity, category, categoryId, store, storeId, status, addedAt, listId, tickedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Windeln] }
        brand: { type: [string, 'null'], examples: [Pampers] }
        properties: { type: [string, 'null'], examples: ['Größe 3, Big Pack'] }
        quantity: { type: [string, 'null'], examples: ['2', '500 g'] }
        category: { type: string, examples: [Drogerie] }
        categoryId: { type: string, format: uuid }
        store: { type: [string, 'null'], examples: [dm] }
        storeId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [open, ticked] }
        addedAt: { type: string, format: date-time, examples: ['2026-11-02T08:00:00.123456+00:00'] }
        listId: { type: string, format: uuid, description: The list the item is on (GET /v1/lists). }
        tickedAt: { type: string, format: date-time, description: When it was ticked. }
    Usual:
      type: object
      additionalProperties: false
      required: [name, quantity, uses, lastUsed, due]
      properties:
        name: { type: string, examples: [Milch] }
        quantity: { type: [string, 'null'] }
        uses: { type: integer, minimum: 1 }
        lastUsed:
          type: string
          format: date-time
          description: The start of the last day it was used, in Berlin time; never a tick's time.
        due: { type: boolean }
    PremiumRequiredError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { type: string, const: premium_required }
            message: { type: string, description: English text for a developer; may change. }
            details:
              type: object
              additionalProperties: false
              required: [integration, unlock]
              description: Which integration is locked and where it unlocks. No link and no price.
              properties:
                integration: { type: string, const: api }
                unlock: { type: string, const: app, description: Unlocked in the Snacklist app. }
    Counts:
      type: object
      additionalProperties: false
      required: [open, checkedLast24h]
      properties:
        open: { type: integer, minimum: 0 }
        checkedLast24h: { type: integer, minimum: 0 }
    Named:
      type: object
      additionalProperties: false
      required: [id, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - validation_failed
                - invalid_cursor
                - invalid_id
                - invalid_idempotency_key
                - missing_token
                - invalid_token
                - premium_required
                - insufficient_scope
                - not_found
                - item_not_found
                - method_not_allowed
                - conflict
                - payload_too_large
                - unsupported_media_type
                - store_not_found
                - category_not_found
                - ambiguous_store
                - ambiguous_category
                - list_not_found
                - ambiguous_list
                - too_many_lists
                - too_many_stores
                - anchor_not_found
                - anchor_in_other_store
                - items_not_in_store
                - order_mode
                - idempotency_key_reused
                - rate_limited
                - auth_throttled
                - internal_error
                - timeout
                - unavailable
            message: { type: string, description: English text for a developer; may change. }
            details: { type: object }
  responses:
    OneItem:
      description: The item.
      headers: *ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Item' }
    Catalog:
      description: The whole list (short; nextCursor is always null).
      headers: *ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, nextCursor]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/Named' } }
              nextCursor: { type: 'null' }
    OneList:
      description: The list.
      headers: *ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/List' }
    OneStore:
      description: The store (201 made, 200 one the household had by that name).
      headers: *ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Named' }
    Layout:
      description: Every category in the store's walk order (nextCursor is always null).
      headers: *ok
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, nextCursor]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/LayoutCategory' } }
              nextCursor: { type: 'null' }
    LimitReached:
      description: >-
        too_many_lists or too_many_stores (details.limit, 50); or conflict, a concurrent change got
        in the way. Nothing was changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: >-
        An error. A 503 unavailable carries Retry-After; it is also the answer while the household
        or the key is being changed at that moment. A 503 timeout is a request that took too
        long, or waited 5 seconds for earlier requests with the same member's keys; nothing was
        changed.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: invalid_json, validation_failed, invalid_cursor, invalid_id or invalid_idempotency_key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing_token or invalid_token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PremiumRequired:
      description: premium_required; the key's holder needs Snacklist Premium for the API (their own plan, or a grant of the key's household). Nothing was read or changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PremiumRequiredError' }
    Forbidden:
      description: insufficient_scope (details.required names the scope).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: item_not_found, or for a list or store in the path list_not_found or store_not_found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >-
        conflict (a concurrent change got in the way, nothing was changed; retry) or order_mode
        (a store order in a household with the categories order).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EditConflict:
      description: >-
        conflict; either a concurrent change got in the way (retry), or the new name would make the
        item the twin of another open item on its list (a retry gets the same answer). Nothing was
        changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: payload_too_large; the body is over 64 KiB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: unsupported_media_type; send application/json.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: store_not_found, category_not_found, list_not_found, ambiguous_store, ambiguous_category, ambiguous_list, anchor_not_found, anchor_in_other_store, items_not_in_store or idempotency_key_reused.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: rate_limited or auth_throttled.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/Limit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/Remaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/Reset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
