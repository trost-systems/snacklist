    assist:
      status: draft
      h: [Läuft auch, von selbst.]
      sticker:
        ask: Wir machen Apfelpfannkuchen. Setz die Zutaten auf unsere Liste.
        reply: Steht auf eurer Liste
        items: [Äpfel, Eier, Mehl]
      variants:
        neutral:
          s: KI-Assistenten schreiben mit.
          alt: Ein KI-Assistent setzt Äpfel, Eier und Mehl auf die Liste; bei Anna erscheinen sie sofort gelb markiert.
        named:
          s: Verbinde deinen KI-Assistenten über MCP.
          alt: Ein KI-Assistent setzt über MCP Äpfel, Eier und Mehl auf die Liste; bei Anna erscheinen sie sofort gelb markiert.
    api:
      status: draft
      h: ["Für Bastler:", MCP und API.]
      s: Verbinde KI-Assistenten über MCP und eigene Automationen über die API.
      alt: Der Bildschirm Zugänge mit der Adresse des MCP-Servers und dem API-Bereich, noch ohne API-Schlüssel.
      may_name: [MCP, API]
      premium: Mit Snacklist Premium
    invite:
      status: draft
      h: [Alle dabei., Viele Listen.]
      s: Lade alle ein. So viele Listen, wie ihr wollt.
      alt: Haushaltsseite mit Anna und Jonas, „Leute einladen“ und eigenen Listen für Wocheneinkauf, Baumarkt und Geburtstag.
