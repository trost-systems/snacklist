# Every word the store files show besides the app's own (docs/STORE_SCREENSHOTS.md, job 215, Legal
# caption rules N-187 to N-195, job 252).
#
#   <locale>:
#     shots:               one entry per shot id of sets.mjs, here in store order
#       <id>:
#         status:          draft | approved (approved only after Peter and Legal)
#         h: [line 1, line 2]   the headline, always two lines
#         s:               the subline
#         alt:             the store's alt text, at most 140 characters
#         sticker:         words drawn on the shot's sticker (voice: the spoken sentence; assist:
#                          the request, the reply and the items the assistant adds)
#         appstore:        replaces s and alt on the App Store set only (voice: Siri, N-189, N-195)
#         premium:         the label --premium-label puts on the frame once AI assistants are paid
#                          (Apple 2.3.2, N-193; no price, 2.3.7)
#     feature: { status, tagline, alt }    the Play feature graphic
#
# The words a sticker shows are what the capture really sends: the voice sentence goes to the
# local voice function, the assist items to the local mcp function.
# Never in a caption: Alexa (N-187), an AI brand (N-191), API or Automationen (N-194), kostenlos or
# free (N-190), a price, Siri on Play (N-195), Hey Siri, einfach, no setup, a trademark sign
# (N-189), alcohol or tobacco (age 4+), the 50-list cap. captions.mjs enforces it.

