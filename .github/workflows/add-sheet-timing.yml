# Job 274: keystroke to stable rows in the add sheet, measured in a profile build on an Android
# emulator (x86_64, KVM), with the flags off, `input-stable-rows` only and `on-device-catalog` on
# (app/test_driver/add_sheet_timing_probe.dart). A measurement, not a gate: it runs on a push to a
# `timing/**` branch or by hand, never on a PR, and ci-ok does not need it. A head commit with the
# trailer `Timing-base: <sha>` also builds that commit (with this commit's probe) and the passes
# alternate the two APKs on one emulator (scripts/add-sheet-timing.sh). The table goes to the job
# summary; the logs are the artifact `add-sheet-timing`.
name: Add sheet timing

on:
  push:
    branches: ['timing/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-28.2.13676358-cmake-3.22.1-${{ runner.os }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The runner's /dev/kvm is root-only; the emulator needs it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runner
        run: nproc && grep -m1 'model name' /proc/cpuinfo && free -m
      - working-directory: app
        run: |
          flutter build apk --profile --target-platform android-x64 --dart-define=ADD_SHEET_TIMING=true \
            --target=test_driver/add_sheet_timing_probe.dart
          mkdir -p build/timing && cp build/app/outputs/flutter-apk/app-profile.apk build/timing/head.apk
      - name: Base APK
        run: |
          base=$(git log -1 --format='%(trailers:key=Timing-base,valueonly)' | head -n1 | tr -d '[:space:]')
          if [[ -z $base ]]; then echo 'No Timing-base trailer: head only.'; exit 0; fi
          git worktree add "$RUNNER_TEMP/base" "$base"
          cp app/test_driver/add_sheet_timing_probe.dart app/test_driver/timeline_profile.dart "$RUNNER_TEMP/base/app/test_driver/"
          cd "$RUNNER_TEMP/base/app"
          flutter build apk --profile --target-platform android-x64 --dart-define=ADD_SHEET_TIMING=true \
            --target=test_driver/add_sheet_timing_probe.dart
          cp build/app/outputs/flutter-apk/app-profile.apk "$GITHUB_WORKSPACE/app/build/timing/base.apk"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          # The sheet's own motion runs, as on most phones.
          disable-animations: false
          working-directory: app
          script: |
            adb shell getprop ro.product.cpu.abi; adb shell nproc; adb shell getprop ro.build.version.sdk; adb shell wm size; adb shell wm density
            ../scripts/add-sheet-timing.sh build/timing 3 $(ls build/timing/*.apk | sed -E 's#.*/(.*)\.apk$#\1=&#') > build/timing/table.md
      - name: Summary
        if: always()
        working-directory: app
        run: |
          cat build/timing/table.md >> "$GITHUB_STEP_SUMMARY" || echo 'No table: the probe did not finish.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: add-sheet-timing
          path: |
            app/build/timing/*.log
            app/build/timing/table.md
          if-no-files-found: ignore
