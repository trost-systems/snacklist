# Uploads the staged Play listing text (app/fastlane/metadata/android/*: title, short and full
# description per locale; no bundle, track, image or screenshot) with the held production release
# (from launch day, under managed publishing) or right after it is published, and reads it back.
# preflight reads production's releases without opening an edit. Lanes `android listing` and `android listing_check`
# (app/fastlane/Fastfile), docs/RELEASE.md section "Store listing upload".
name: Play listing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: validate (any day, nothing changes on Play), upload (with or after the production release), check (read back Play and the store pages), preflight (production's release states; no edit)
        type: choice
        options: [validate, upload, check, preflight]
        default: validate
      published_version_code:
        description: versionCode of the production release (an upload needs it PUBLISHED, or held by managed publishing with with_held_release)
        type: string
        default: ""
      with_held_release:
        description: upload joins the release still held by managed publishing (APPROVED_NOT_PUBLISHED), from held_release_from on
        type: boolean
        default: false
      held_release_from:
        description: when the held-release path opens (ISO 8601; Peter K1, launch day)
        type: string
        default: "2026-12-01T00:00:00+01:00"

concurrency:
  group: play-listing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The service account trusts only the release environment's OIDC token.
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No Actions cache in a job that names an environment (job 220).
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          working-directory: app
      - name: Install the gems from the lockfile
        run: |
          bundle config set --local deployment true
          bundle install --jobs 4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1023711338330/locations/global/workloadIdentityPools/github/providers/family-groceries
          service_account: play-release@family-groceries-ci.iam.gserviceaccount.com
      - run: bundle exec fastlane android "$LANE"
        env:
          LANE: ${{ inputs.mode == 'check' && 'listing_check' || inputs.mode == 'preflight' && 'listing_preflight' || 'listing' }}
          RELEASE_UPLOAD: ${{ inputs.mode == 'upload' }}
          PLAY_PUBLISHED_VERSION_CODE: ${{ inputs.published_version_code }}
          PLAY_LISTING_WITH_HELD_RELEASE: ${{ inputs.with_held_release }}
          PLAY_LISTING_HELD_FROM: ${{ inputs.held_release_from }}
