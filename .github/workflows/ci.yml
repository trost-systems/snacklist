# Every gate a PR must pass. ci-ok is the single required check.
# Structure (concurrency, SHA-pinned actions, ci-ok gate) follows trost-systems/emotely.
# Each job installs tools and runs scripts/gates/<gate>.sh, the scripts scripts/verify.sh runs
# locally too: one gate per job, or several small ones in one job, since each job holds one of the
# 20 runners GitHub gives us at once (job 309). scripts/check-gates.sh keeps every gate run by
# exactly one job. Measurements: docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Job 308: every gate on main once a night, android, ios and ios-storekit included. A push to
  # main reuses its PR's run when that tested the same tree (scripts/ci-main-reuse.sh), else it
  # runs what its commit's range needs, like a PR (docs/CI.md, Main and the nightly run).
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

# A PR's newer push cancels its older run. Main's runs never cancel each other: a push run is per
# commit, a nightly or manual run per run, so a manual run cannot end a nightly one (job 308).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0
  SUPABASE_CLI_VERSION: 2.121.0
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  AST_GREP_VERSION: 0.51.0
  SQUAWK_VERSION: 2.70.0
  # npm retries a failed fetch twice by default; npm ci and supabase/setup-cli (an npm install) hit 5xx.
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
  # Where the CLI pulls the Supabase images. public.ecr.aws (its default) answered runners
  # "toomanyrequests" (job 11), and so did ghcr.io for hours on 2026-10-27, also with a token
  # login; Docker Hub pulled every image (DECISIONS job 15b).
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

jobs:
  # Which gates this change needs (scripts/ci-changes.sh lists the paths): docs-only changes
  # skip the heavy gates, site-only ones db and e2e too, server- and e2e-only ones flutter and
  # web-prod (job 309); android and ios, fastlane, and emails each run only for their own.
  # Job 308: a push to main whose PR run tested the same tree runs none of them (reuse), any
  # other push runs what its PR would have; the nightly and a manual run run everything.
  # Job 307: a PR opened as a draft runs nothing. Its branch is not yet the one commit main
  # takes; scripts/push-pr.sh pushes that seconds later and marks the PR ready. Opened as a
  # draft, the run of the first push no longer starts only to be cancelled (62 runs a week).
  # changes and ci-ok carry this condition; the other jobs need changes.
  changes:
    if: github.event.action != 'opened' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      reuse: ${{ steps.filter.outputs.reuse }}
      heavy: ${{ steps.filter.outputs.heavy }}
      stack: ${{ steps.filter.outputs.stack }}
      app: ${{ steps.filter.outputs.app }}
      native: ${{ steps.filter.outputs.native }}
      fastlane: ${{ steps.filter.outputs.fastlane }}
      emails: ${{ steps.filter.outputs.emails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # A pull_request checkout is the merge commit, whose first parent is the base.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT" ;;
            push)
              reuse="$(scripts/ci-main-reuse.sh HEAD)"
              echo "$reuse" | tee -a "$GITHUB_OUTPUT"
              # A push of several commits (not merge-pr.sh's one) has no range here: all gates.
              if [ "$reuse" = reuse=true ]; then
                printf 'heavy=false\nstack=false\napp=false\nnative=false\nfastlane=false\nemails=false\n' | tee -a "$GITHUB_OUTPUT"
              elif [ "$BEFORE" = "$(git rev-parse HEAD^1)" ]; then
                scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
              else
                scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
              fi
              ;;
            *) scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT" ;;
          esac

  # Job 309: a job may run several gates (docs/CI.md, Jobs and gates). Each gate is its own step,
  # and a later gate runs after an earlier one failed, so one run reports every failure.
  # The lint job: gitleaks, the changelog (on pull requests) and lint. Job 308: not on a push to
  # main that reuses its PR's run, which ran them on the same tree.
  lint:
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # gitleaks reads the full history; the changelog gate the PR head (HEAD^2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            emails/package-lock.json
      - uses: ./.github/actions/deno
        with:
          # tool/lint/ts/pack.ts lists every lint rule of exactly this Deno; bump both together.
          deno-version-file: .dvmrc
      # Job 113: pinned tools come from the cache, else scripts/ci/download.sh with retries.
      # gitleaks; actionlint for the workflows; ast-grep and squawk for scripts/lint.sh (job 12).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fg-ci-tools
          key: ci-tools-${{ runner.os }}-gitleaks-${{ env.GITLEAKS_VERSION }}-actionlint-${{ env.ACTIONLINT_VERSION }}-ast-grep-${{ env.AST_GREP_VERSION }}-squawk-${{ env.SQUAWK_VERSION }}
      - run: scripts/ci/install-tools.sh gitleaks actionlint ast-grep squawk
      - run: scripts/gates/gitleaks.sh
      # Job 39: the PR's `## Changelog` section (docs/CHANGELOG.md), on pull requests only.
      # Dependabot PRs carry none and need none: their bumps are no user-visible change.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/') }}
        run: scripts/gates/changelog.sh
      - if: ${{ !cancelled() }}
        run: scripts/gates/lint.sh

  db:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Job 27: the setup lives in a composite action that e2e.yml's db job runs too.
      - uses: ./.github/actions/db-setup
        with:
          supabase-cli-version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: scripts/gates/db.sh

  # The Deno projects: the edge functions and their tooling, the ops dashboard (nexus/, job 156)
  # and the fg verification CLI (job 05).
  deno:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deno
        with:
          # The gates resolve frozen (job 220): the Deno that wrote the locks, not the newest 2.x.
          deno-version-file: .dvmrc
      - run: scripts/gates/functions.sh
      - if: ${{ !cancelled() }}
        run: scripts/gates/nexus.sh
      - if: ${{ !cancelled() }}
        run: scripts/gates/fg-cli.sh

  # The guides site (site/, job 24a), then snacklist.app for AI agents (job 93): the checks that
  # need the network or a browser (the MCP probe, the served site, the waitlist form). Runs but on
  # a reused main push (job 308): guide content is Markdown, which ci-changes.sh counts as
  # documentation.
  site:
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site/checks/package-lock.json
      - run: scripts/gates/site.sh
      - if: ${{ !cancelled() }}
        run: scripts/gates/site-agent.sh

  # Job 55: the Snacklist mails (emails/) and the Supabase templates built from them.
  emails:
    needs: changes
    if: needs.changes.outputs.emails == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emails/package-lock.json
      - run: scripts/gates/emails.sh

  flutter:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/flutter.sh

  web-prod:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/web-prod.sh

  # Playwright is the critical path, so the suite runs as four shards, each with its own stack
  # (job 221, docs/CI.md). The shard list alone sets the count: Playwright gets it as
  # strategy.job-total, so no test is left out when the list changes. check-gates.sh keeps the
  # list the matrix's only key.
  # Job 27: the steps before and after the gate are composite actions that the on-demand e2e.yml
  # runs too (docs/CI.md, On-demand e2e).
  e2e:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Job 18: the fg sync smoke test (shard 1) stacks the client videos with ffmpeg.
      - uses: ./.github/actions/e2e-setup
        with:
          supabase-cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          ffmpeg: ${{ matrix.shard == 1 }}
      - run: scripts/gates/e2e.sh --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/e2e/screenshots
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/e2e-report
        with:
          job-status: ${{ job.status }}
          artifact-name: playwright-${{ matrix.shard }}
          results-name: e2e-results-${{ matrix.shard }}

  # Job 4 (release): the Gemfile.lock installs and the Fastfile parses.
  fastlane:
    needs: changes
    if: needs.changes.outputs.fastlane == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          working-directory: app
          bundler-cache: true
      - run: scripts/gates/fastlane.sh

  # Job 4b: the app's own Kotlin and Swift (the on-device speech check) compile; job 115: the
  # Kotlin's JVM unit tests (the home widget's payload parser) run.
  android:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      # The NDK (flutter.ndkVersion of this Flutter) and CMake the build installs on first use.
      # Only these two: the runner's preinstalled NDKs are several GB.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-28.2.13676358-cmake-3.22.1-${{ runner.os }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/android.sh

  ios:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/xcode
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          # The post step hashes '**/pubspec.lock' again after the build; over the iOS build's
          # files that ran past hashFiles' 120 s and failed the job (#703). The gate runs pub get.
          pub-cache: false
      - run: scripts/gates/ios.sh

  # Job 304: the StoreKit tests on their iOS 26.2 simulator, beside the ios job instead of after
  # it. Each job builds the app (about 5 min); the simulator's first boot and the tests took 6 to
  # 18 min of the ios job (docs/CI.md, The ios jobs).
  ios-storekit:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: xcode-27
    # The iOS 26.2 runtime downloads while the gate builds (scripts/gates/ios-storekit.sh).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/xcode
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          # The post step hashes '**/pubspec.lock' again after the build; over the iOS build's
          # files that ran past hashFiles' 120 s and failed the job (#703). The gate runs pub get.
          pub-cache: false
      - run: scripts/gates/ios-storekit.sh

  # Job 13: GitHub never turns a schedule back on that it disabled for 60 days of inactivity, so
  # every push to main re-enables the keepalive (docs/DEPLOY.md, Keepalive). Job 13b: and the
  # nightly backup (docs/BACKUP.md). Job 23: and the release, whose per-merge workflow_run
  # trigger stops too while it is disabled (docs/RELEASE.md).
  keepalive-schedule:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow enable backup.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow enable release.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow enable feedback-digest-watch.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  ci-ok:
    needs: [changes, lint, db, deno, site, emails, flutter, web-prod, e2e, fastlane, android, ios, ios-storekit]
    if: ${{ !cancelled() && (github.event.action != 'opened' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Job 308: a red nightly run keeps one open issue, like backup.yml (scheduled runs mail whoever
  # last edited the cron line); the next green nightly closes it.
  nightly-report:
    needs: [ci-ok]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Nightly CI failed on main'
      RESULT: ${{ needs.ci-ok.result }}
    steps:
      - run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [ "$RESULT" = success ]; then
            [ -z "$open" ] || gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Nightly run $run is green again."
          else
            body="Nightly run $run on $GITHUB_SHA failed: every gate ran on main, native ones included. docs/CI.md, section Main and the nightly run, says what to do."
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
            fi
          fi
