  source: "Legal handoff 21:55, 2.4 (question as in Launch V1)."
waitlist.faq.email.a:
  de: "⟦LEGAL W2⟧ Wir nutzen sie für die Warteliste und die Einladung zur Beta, und, wenn du das angekreuzt hast, für eine E-Mail zum Start der App. Für die Einladung geht sie an Apple bzw. Google. Alles Weitere steht in der [Datenschutzerklärung](/datenschutz)."
  en: "⟦LEGAL W2⟧ We use it for the waitlist and the beta invite, and, if you ticked the box, for one email when the app launches. For the invite it goes to Apple or Google. Details are in the [privacy policy](/en/privacy)."
  status: draft
  source: "Legal handoff 21:55, 2.4, word for word; the link replaces Launch V1's [LEGAL: Link Datenschutzerklärung]."
waitlist.faq.install-ios.q:
  de: "Wie installiere ich die Beta auf dem iPhone?"
  en: "How do I install the beta on iPhone?"
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.install-ios.a:
  de: "⟦LAUNCH COPY FAQ⟧ Deine Einladung kommt per E-Mail von Apple (TestFlight), an die Adresse, mit der du dich auf der Warteliste eingetragen hast. Lad dir zuerst Apples kostenlose App „TestFlight“ aus dem App Store. Öffne dann die Einladungsmail auf deinem iPhone, tipp auf den Knopf darin und installier Hummlist in TestFlight. Einen öffentlichen Link gibt es nicht."
  en: "⟦LAUNCH COPY FAQ⟧ Your invite comes by email from Apple (TestFlight), sent to the address you used for the waitlist. First, get Apple's free TestFlight app from the App Store. Then open the invite email on your iPhone, tap the button in it, and install Hummlist in TestFlight. There's no public link."
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.install-android.q:
  de: "Wie installiere ich die Beta auf Android?"
  en: "How do I install the beta on Android?"
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.install-android.a:
  de: "⟦LAUNCH COPY FAQ⟧ In deiner Einladungsmail ist ein Knopf „Beta beitreten“. Öffne ihn auf deinem Handy, und zwar mit dem Play Store im selben Google-Konto wie die E-Mail-Adresse, an die die Einladung ging. Bestätige dort die Teilnahme und installier Hummlist dann aus dem Play Store. Updates kommen danach ganz normal über den Play Store."
  en: "⟦LAUNCH COPY FAQ⟧ Your invite email has a \"Join the beta\" button. Open it on your phone, with the Play Store signed in to the same Google account as the email address the invite went to. Accept there, then install Hummlist from the Play Store. After that, updates arrive as normal Play Store updates."
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.wrong-email.q:
  de: "Ich habe mich mit der falschen E-Mail eingetragen. Was jetzt?"
  en: "I signed up with the wrong email. What now?"
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.wrong-email.a:
  de: "⟦LAUNCH COPY FAQ⟧ Die Einladung klappt nur mit der E-Mail deiner Apple-ID (iPhone) bzw. deines Google-Kontos (Android). Trag dich auf hummlist.com einfach noch mal mit der richtigen Adresse ein."
  en: "⟦LAUNCH COPY FAQ⟧ The invite only works with the email of your Apple ID (iPhone) or Google account (Android). Just sign up again on hummlist.com/en with the right address."
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.no-invite.q:
  de: "Meine Einladung ist nicht angekommen. Was kann ich tun?"
  en: "My invite hasn't arrived. What can I do?"
  status: draft
  source: "Launch install FAQ (late-signup brief B)."
waitlist.faq.no-invite.a:
  de: "⟦LAUNCH COPY FAQ⟧ Schau im Spam-Ordner nach und bei Gmail auch im Tab „Werbung“. Wir verschicken die Einladungen in Wellen: die erste am 15. November, danach jede Woche. Auf dem iPhone kommt die TestFlight-Mail von Apple, nicht von Hummlist. Fehlt sie dann immer noch, schreib an [support@hummlist.com](mailto:support@hummlist.com)."
  en: "⟦LAUNCH COPY FAQ⟧ Check your spam folder, and in Gmail the Promotions tab too. We send invites in waves: the first on November 15, then every week. On iPhone, the TestFlight email comes from Apple, not from Hummlist. If it's still missing, write to [support@hummlist.com](mailto:support@hummlist.com)."
  status: draft
  source: "Launch install FAQ (late-signup brief B); the address linked."
waitlist.closing.title:
  de: "⟦LAUNCH COPY⟧ Einkaufen ohne Werbung, ab November."
  en: "⟦LAUNCH COPY⟧ Grocery shopping without ads, starting in November."
  status: draft
  source: "Launch V1 closing call."
waitlist.back:
  de: "Zurück zu hummlist.com"
  en: "Back to hummlist.com"
  status: draft
  source: "Launch shared blocks, state 2 link."

