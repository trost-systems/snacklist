<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero</title>
<link rel="stylesheet" href="scenes.css">
<style>
  :root { --ground: var(--hl-color-cobalt); }

  .phone { left: 72px; top: 72px; width: 356px; height: 520px; }
  /* The real app's list screen (capture-hero.mjs), as wide as the screen, from the top. */
  .shot { display: block; width: 100%; height: auto; }

  .sync { left: 22px; top: 26px; max-width: 250px; transform: rotate(-3deg); }

  @media (max-width: 400px) {
    .phone { left: 24px; top: 52px; width: 310px; height: 400px; }
    /* Room for the sticker above the app's header. */
    .shot { margin-top: 26px; }
    .sync { left: 50%; top: 20px; translate: -50% 0; max-width: none; white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <picture>
        <source data-shot="compact-dark" media="(max-width: 400px) and (prefers-color-scheme: dark)">
        <source data-shot="compact" media="(max-width: 400px)">
        <source data-shot="wide-dark" media="(prefers-color-scheme: dark)">
        <img class="shot" data-shot="wide" alt="">
      </picture>
    </div>
  </div>
  <p class="sticker sync"><span class="hxp av av--tomato">A</span><span data-t="sync"></span></p>
</div>
<script>
  globalThis.STRINGS = {
    de: { sync: 'Anna hat „Hafermilch“ hinzugefügt' },
    en: { sync: 'Anna added “Oat milk”' },
  };
</script>
<script src="scene.js"></script>
<script>
  // scene.js's lang: the screen filmed in that language (hero-screen/, capture-hero.mjs).
  for (const el of document.querySelectorAll('[data-shot]')) el[el.tagName === 'IMG' ? 'src' : 'srcset'] = `hero-screen/${lang}-${el.dataset.shot}.webp`;
</script>
</body>
</html>
